{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "matrix.fullname" . }}
  labels:
    {{- include "matrix.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.server.name | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.server.name | quote }}
      http:
        paths:
          - path: /_matrix
            pathType: Prefix
            backend:
              service:
                name: {{ include "matrix.synapse.fullname" . }}
                port:
                  number: {{ .Values.synapse.service.port }}
          - path: /_synapse
            pathType: Prefix
            backend:
              service:
                name: {{ include "matrix.synapse.fullname" . }}
                port:
                  number: {{ .Values.synapse.service.port }}
          {{- if .Values.element.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "matrix.element.fullname" . }}
                port:
                  number: {{ .Values.element.service.port }}
          {{- end }}
    {{- if .Values.ingress.catchAll }}
    - http:
        paths:
          - path: /_matrix
            pathType: Prefix
            backend:
              service:
                name: {{ include "matrix.synapse.fullname" . }}
                port:
                  number: {{ .Values.synapse.service.port }}
          - path: /_synapse
            pathType: Prefix
            backend:
              service:
                name: {{ include "matrix.synapse.fullname" . }}
                port:
                  number: {{ .Values.synapse.service.port }}
          {{- if .Values.element.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "matrix.element.fullname" . }}
                port:
                  number: {{ .Values.element.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
